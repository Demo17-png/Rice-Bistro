<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Page</title>
     <link rel="stylesheet" href="./style.css">
    <link rel="icon" href="./Images/ricelogo.png">
</head>
<body>
    <div class="container">

<h1>🍛 Food Order Form</h1>

<form id="orderForm">

<label>Full Name</label>
<input type="text" id="name" required>

<label>WhatsApp Number</label>
<input type="tel" id="phone" required>

<label>Select Food</label>
<select id="food" required>

<option value="">Choose Food</option>

<option value="White rice, stew, chicken" data-price="4500">
White rice, stew, chicken - ₦4,500
</option>

<option value="White rice, stew, meat" data-price="4300">
White rice, stew, meat - ₦4,300
</option>

<option value="White rice, stew, fish" data-price="5000">
White rice, stew, fish - ₦5,000
</option>

<option value="Jollof rice, chicken" data-price="4800">
Jollof rice, chicken - ₦4,800
</option>

<option value="Jollof rice, meat" data-price="4600">
Jollof rice, meat - ₦4,600
</option>

<option value="Jollof rice, fish" data-price="5200">
Jollof rice, fish - ₦5,200
</option>

<option value="Fried rice, chicken" data-price="4800">
Fried rice, chicken - ₦4,800
</option>

<option value="Fried rice, meat" data-price="4700">
Fried rice, meat - ₦4,700
</option>

<option value="Fried rice, fish" data-price="5000">
Fried rice, fish - ₦5,000
</option>

<option value="Fried rice and Jollof rice, chicken" data-price="6500">
Fried rice & Jollof rice, chicken - ₦6,500
</option>

<option value="Fried rice and Jollof rice, meat" data-price="6300">
Fried rice & Jollof rice, meat - ₦6,300
</option>

<option value="Fried rice and Jollof rice, fish" data-price="7000">
Fried rice & Jollof rice, fish - ₦7,000
</option>

</select>

<label>Preferred Delivery Date</label>

<textarea id="date" rows="4" placeholder="What date should your food be delivered?"></textarea>


<label>Preferred Delivery Time</label>

<select id="time" required>

<option value="">Select Time</option>
<option>10:00 AM</option>
<option>12:00 PM</option>
<option>2:00 PM</option>
<option>4:00 PM</option>
<option>6:00 PM</option>
<option>8:00 PM</option>

</select>
<label>Delivery Address</label>

<textarea id="address" rows="4" placeholder="Fill your detailed delivery address"></textarea>


<label>Additional Comments</label>

<textarea id="comments" rows="4" placeholder="Any special requests?"></textarea>

<button type="submit">
Place Order on WhatsApp
</button>

</form>

<div class="footer">
Thank you for ordering with us.
</div>

</div>

<script src="./main.js"></script>
</body>
</html>
